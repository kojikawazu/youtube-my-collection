# Dependabot 設定
#
# ワークフローが参照する action のバージョンを追随させる（issue #202）。
# Node 20 非推奨により旧版（node20 ランタイム）の action は Node 24 で強制実行されている。
# 手で一括置換せず、更新 PR を Dependabot に作らせてレビュー・マージする。
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" を指定すると .github/workflows/ 配下を走査する。
    directory: /
    schedule:
      interval: weekly
    # 個人プロジェクトで PR が溢れないよう上限を設ける。
    open-pull-requests-limit: 5

  # フロント（pnpm）の依存を追随させる（issue #210）。
  # ここに無いと、作られた更新 PR が管理外になり `@dependabot rebase` も効かない（#203）。
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # minor / patch は 1 本の PR にまとめ、レビュー単位を減らす。
    # major は破壊的変更を個別に確認するため、従来どおり 1 依存 1 PR で出させる。
    groups:
      # Prisma は CLI（prisma）とクライアント（@prisma/*）のバージョンが揃っていないと動かない。
      # 1 依存 1 PR だと major でクライアントだけ上がり CI が壊れる（#215）ため、major も含めて
      # 常に同じ PR で上げる。依存は最初に一致したグループに入るので、minor-and-patch より先に置く。
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
