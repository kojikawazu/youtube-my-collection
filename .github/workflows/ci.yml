name: CI

# アプリケーションコードの検査のみを担当する。
# ドキュメントは docs.yml、ワークフロー自体の検査は workflows-lint.yml が担当する
# （発火条件が違うものを同居させない — .claude/rules/github-actions.md）。
on:
  # push は main のみ。作業ブランチは PR で回れば十分（二重実行を避ける）。
  push:
    branches:
      - main
    paths:
      - "front/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "front/**"
      - ".github/workflows/ci.yml"

# 同一 PR への連続 push で古い実行をキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。チェックアウト以外に必要な権限はない。
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client を生成しないと @prisma/client が型を export せず typecheck が落ちる。
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit Test
        run: pnpm run test

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Integration Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ymc_test?schema=public
        run: pnpm run test:it

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          # 公開フローは実テスト DB（IT で起動済み）を読む。auth はモックのまま。
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ymc_test?schema=public
        run: pnpm run test:e2e
