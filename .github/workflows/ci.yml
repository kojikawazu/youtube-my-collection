name: CI

# アプリケーションコードの検査のみを担当する。
# ドキュメントは docs.yml、ワークフロー自体の検査は workflows-lint.yml が担当する
# （発火条件が違うものを同居させない — .claude/rules/github-actions.md）。
#
# lint-and-test は必須チェックのため、ワークフローレベルの paths を付けない。
# 付けると対象外の PR でワークフロー自体が起動せず、必須チェックが pending のまま
# マージ不能になる（issue #205）。常に起動し、changes ジョブの判定でジョブ単位にスキップする
# （ジョブの if: によるスキップは skipped = 必須チェックとして成功扱い）。
on:
  # push は main のみ。作業ブランチは PR で回れば十分（二重実行を避ける）。
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一 PR への連続 push で古い実行をキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。チェックアウト以外に必要な権限はない。
permissions:
  contents: read

jobs:
  # アプリに関係する変更があるかを判定する。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter は pull_request では変更ファイル一覧を REST API で取得するため pull-requests: read が要る。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # push では API ではなく git の差分で判定するため、チェックアウトが必要。
      - name: Checkout
        uses: actions/checkout@v7

      # 判定は除外リストで書く（ドキュメント類以外はすべてアプリの変更とみなす）。
      # 対象リストにすると、新しいディレクトリが増えたときに黙ってテストが走らなくなる。
      # every = 「すべてのパターンに一致したファイルがあれば true」。'**' と否定パターンの AND で除外を表す
      # （既定の some では否定パターンが効かない）。
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!tasks/**'
              - '!.claude/**'
              - '!**/*.md'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client を生成しないと @prisma/client が型を export せず typecheck が落ちる。
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # server-only による server/client 境界の違反はビルド時にしか検出されない
      # （Client Component が lib/db・lib/auth-server を引き込むとここで落ちる）。
      # 型チェックの後・テストの前に置き、壊れたビルドで長いテストを回さないようにする。
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
        run: pnpm run build

      - name: Unit Test
        run: pnpm run test

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Integration Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ymc_test?schema=public
        run: pnpm run test:it

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          # 公開フローは実テスト DB（IT で起動済み）を読む。auth はモックのまま。
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ymc_test?schema=public
        run: pnpm run test:e2e
