name: Workflows Lint

# ワークフロー定義自体の検査（actionlint + 同梱の shellcheck）。
# 数秒で終わるため、ワークフローレベルの paths を付けず常に実行する。
# 必須チェックにしたとき、paths で起動しないと pending のまま PR がマージできなくなる罠も避けられる
# （.claude/rules/github-actions.md「actionlint」）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ローカルと同じコマンドで実行する。イメージとバージョンの定義は Makefile の ACTIONLINT_IMAGE が正本。
      - name: Run actionlint
        run: make actionlint
