name: Secret Scan

# 鍵・.env 系の秘匿ファイルが Git の追跡対象に入っていないかを検査する（issue #190）。
# どの種類の変更でも混入しうるため、ワークフローレベルの paths を付けず常に実行する
# （.claude/rules/github-actions.md。git ls-files はインデックスを読むだけで数秒で終わる）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 判定（正規表現）のテストと、追跡ファイルの検査をローカルと同じコマンドで実行する。
      - name: Assert no secret files are tracked
        run: make secret-scan
